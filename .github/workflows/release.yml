name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance — without it `--provenance` fails at publish.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          # Load-bearing: without registry-url, setup-node writes no .npmrc and
          # the publish fails on auth even with NODE_AUTH_TOKEN set.
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Publishing an unverified tree is how a broken release ships. The full
      # gate runs again here rather than trusting the CI run on the commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Fail rather than publish a version that does not match the tag people
      # will look for. Tag `v0.2.0` must mean package version `0.2.0`.
      - name: Check version matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME implies version $TAG but package.json says $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # --access public because @better-claw/* is scoped and defaults to
      # restricted. Demos are `private: true`, so they can never be published.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
